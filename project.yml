name: WatchMusic
options:
  bundleIdPrefix: com.amr.watchmusic
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

targets:
  WatchMusic:
    type: application
    platform: iOS
    sources:
      - path: WatchMusic
    info:
      path: WatchMusic/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amr.watchmusic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    # NOTE: no explicit `dependencies:` block here. XcodeGen auto-detects
    # WatchMusicWatch as the companion watch app (via its
    # WKCompanionAppBundleIdentifier) and generates the embed phase itself.
    # Adding an explicit `dependencies: - target: WatchMusicWatch embed: true`
    # on top of that causes XcodeGen to emit the embed copy phase TWICE,
    # which is exactly the "Multiple commands produce ... CopyAndPreserveArchs"
    # archive error. See https://github.com/yonaskolb/XcodeGen/issues/1257

  WatchMusicWatch:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: WatchMusicWatch
    info:
      path: WatchMusicWatch/Info.plist
      properties:
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.amr.watchmusic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amr.watchmusic.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: false