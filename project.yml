name: WatchMusic
options:
  bundleIdPrefix: com.amr.watchmusic
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  # Xcode 26 requires the watch app embed phase to target PlugIns/ (dstSubfolderSpec 13,
  # empty dstPath) instead of the Watch/ folder (dstSubfolderSpec 16) that XcodeGen still
  # generates by default. Without this patch the app won't validate/install on Xcode 26.
  # See https://github.com/yonaskolb/XcodeGen/issues/1613
  postGenCommand: >
    sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|' -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' WatchMusic.xcodeproj/project.pbxproj

targets:
  WatchMusic:
    type: application
    platform: iOS
    sources:
      - path: WatchMusic
    info:
      path: WatchMusic/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amr.watchmusic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: WatchMusicWatch
        embed: true

  WatchMusicWatch:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: WatchMusicWatch
    info:
      path: WatchMusicWatch/Info.plist
      properties:
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: false
        WKCompanionAppBundleIdentifier: com.amr.watchmusic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amr.watchmusic.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        # Must be true: this target is embedded into WatchMusic.app via the
        # `dependencies: embed: true` above. Leaving SKIP_INSTALL false makes
        # Xcode ALSO treat it as its own top-level archive product, and both
        # paths try to produce the same binary output -> "Multiple commands
        # produce ... Applications/WatchMusicWatch.app/WatchMusicWatch".
        # WKRunsIndependentlyOfCompanionApp (already set above) is what
        # actually controls runtime independence, not this setting.
        SKIP_INSTALL: true