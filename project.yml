name: WatchMusic
options:
  bundleIdPrefix: com.amr.watchmusic
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

targets:
  WatchMusic:
    type: application
    platform: iOS
    sources:
      - path: WatchMusic
    info:
      path: WatchMusic/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amr.watchmusic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: WatchMusicWatch
        embed: true

  WatchMusicWatch:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: WatchMusicWatch
    info:
      path: WatchMusicWatch/Info.plist
      properties:
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.amr.watchmusic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amr.watchmusic.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: false
