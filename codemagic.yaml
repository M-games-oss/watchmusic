workflows:
  watchmusic-unsigned:
    name: WatchMusic - Unsigned Build (free sideload)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "WatchMusic.xcodeproj"
        XCODE_SCHEME: "WatchMusic"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project from project.yml
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate
      - name: Build unsigned .app (embeds the Watch app automatically)
        script: |
          cd $CM_BUILD_DIR
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/WatchMusic.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            archive
      - name: Package as unsigned IPA
        script: |
          cd $CM_BUILD_DIR
          APP_PATH=$(find build/WatchMusic.xcarchive/Products/Applications -maxdepth 1 -name "WatchMusic.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: could not find WatchMusic.app in the archive output."
            echo "Contents of build/WatchMusic.xcarchive:"
            find build/WatchMusic.xcarchive
            exit 1
          fi
          echo "Found built app at: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WatchMusic-unsigned.ipa Payload
          echo "IPA contents:"
          unzip -l WatchMusic-unsigned.ipa
          ls -la WatchMusic-unsigned.ipa
    artifacts:
      - "*.ipa"
      - build/WatchMusic.xcarchive